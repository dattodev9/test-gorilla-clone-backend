services:
  postgres:
    image: postgres
    container_name: test-golilla-clone
    restart: no
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test-golilla-clone-postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: test-golilla-clone-redis
    restart: no
    ports:
      - "6380:6379"

volumes:
  postgres_data: